<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmallNoise — выбор студии</title><link rel="stylesheet" href="./shared/launcher.css"></head>
<body>
<main class="launcher">
  <header class="launcher-heading"><span class="mark" aria-hidden="true">≋</span><div><strong>SmallNoise</strong><p>Что будем создавать?</p></div></header>
  <div class="module-grid">
    <a class="module music" href="./music/">
      <div class="module-top"><span class="module-icon" aria-hidden="true">♫</span><span class="module-tag">СТУДИЯ МУЗЫКИ</span></div>
      <h1>SmallMusic</h1><p>Ноты, паттерны и аранжировка трека.</p>
      <span class="module-link">Создать музыку <span aria-hidden="true">↗</span></span>
    </a>
    <a class="module sound" href="./sounds/">
      <div class="module-top"><span class="module-icon" aria-hidden="true">∿</span><span class="module-tag">СТУДИЯ ЗВУКОВ</span></div>
      <h2>SmallSound</h2><p>Удары, шаги, выстрелы и другие короткие эффекты для игр.</p>
      <span class="module-link">Создать звук <span aria-hidden="true">↗</span></span>
    </a>
  </div>
</main>
</body></html>
